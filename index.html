<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#04070B" />
    <title>Neon Bastion</title>
    <meta name="description" content="광고 없는 로그라이크 디펜스 게임 / A roguelike defense game with no ads" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #04070B; overflow: hidden; }
      body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      /* 노치·홈 바 안쪽 영역만 캔버스로 쓴다 (padding 대신 inset 으로 잡아야 Phaser 가 실제 크기를 읽는다) */
      #app { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top); bottom: env(safe-area-inset-bottom); }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
